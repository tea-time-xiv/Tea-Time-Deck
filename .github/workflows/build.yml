name: Build Tea Time Deck

# Pushes and PRs build and check. A release is what happens when the csproj version
# on main names a version that has no tag yet: the version in the file is the only
# thing anyone edits, and CI mints the tag from it. A tag typed by hand was a second
# source of truth that had to be matched to the csproj, and the only report of a
# mismatch was a failed build after the fact.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Two pushes to main in quick succession must not both decide the same version is
# unreleased and race to tag it. PR builds are the throwaway kind, so those cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default: a pull request build has no business writing to the repo.
# Only the release job, which runs for pushes to main alone, is granted write.
permissions:
  contents: read

jobs:

  build:
    runs-on: windows-2022

    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.gate.outputs.release }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read version from csproj
      id: version
      shell: pwsh
      run: |
        $csproj = [xml](Get-Content "dalamud/TeaTimeDeck/TeaTimeDeck.csproj")
        $node = $csproj.SelectSingleNode("//PropertyGroup/Version")
        if (-not $node) { throw "No <Version> element in TeaTimeDeck.csproj" }
        $version = $node.InnerText.Trim()
        Write-Host "csproj version: $version"
        "VERSION=$version" >> $env:GITHUB_ENV
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Decide whether this version still needs releasing
      id: gate
      shell: pwsh
      run: |
        # The tag is the record of what has been released, so its absence is the whole
        # trigger. Asking the remote rather than the checkout keeps this right even when
        # the tag was pushed while this run was queued.
        #
        # This runs for pull requests too, though only a push can release: it is what
        # puts the changelog check on the pull request that bumps the version, so a
        # missing section is a red check to fix rather than a release that aborts
        # halfway with the version already merged.
        $tag = "v$env:VERSION"
        $existing = git ls-remote --tags origin "refs/tags/$tag"
        if ($existing) {
            Write-Host "$tag already exists; nothing to release."
            "release=false" >> $env:GITHUB_OUTPUT
        } else {
            Write-Host "$tag does not exist yet; this build releases it."
            "release=true" >> $env:GITHUB_OUTPUT
        }

    - name: Install .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud-dev.zip
        Expand-Archive -Force dalamud-dev.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build Dalamud plugin
      run: dotnet build dalamud/TeaTimeDeck.slnx --configuration Release

    - name: Collect Dalamud plugin zip
      shell: pwsh
      run: |
        # Dalamud.NET.Sdk already packages the plugin in the layout Dalamud expects
        # (dll + manifest + deps). Repacking it by hand would only risk getting it wrong.
        Copy-Item "dalamud/TeaTimeDeck/bin/Release/TeaTimeDeck/latest.zip" `
                  "$env:GITHUB_WORKSPACE\TeaTimeDeck.zip"

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: streamdeck/package-lock.json

    - name: Build Stream Deck plugin
      working-directory: streamdeck
      run: |
        npm ci
        npm run build

    - name: Test Stream Deck plugin
      working-directory: streamdeck
      # Needs no game, no deck and no network, so it gates every push and PR.
      # The game half's suite is the scripts in tools/, which need a live client.
      run: npm test

    - name: Package Stream Deck plugin
      working-directory: streamdeck
      shell: pwsh
      run: |
        # A .streamDeckPlugin is the double-clickable installer: the Stream Deck app
        # installs and updates from it, so users never hand-copy a folder.
        #
        # --version stamps the csproj version into the manifest, keeping the two halves
        # on one version number. It rewrites manifest.json in place, which is why the
        # committed copy is already in the CLI's own formatting.
        #
        # --no-update-check pins validation to the installed CLI: a schema fetched
        # mid-run could fail a build that has nothing wrong with it.
        npx streamdeck pack xiv.teatime.deck.sdPlugin `
            --version $env:VERSION `
            --output $env:GITHUB_WORKSPACE `
            --no-update-check `
            --force

    - name: Store artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: TeaTimeDeck
        path: |
          TeaTimeDeck.zip
          xiv.teatime.deck.streamDeckPlugin
        if-no-files-found: error
        retention-days: 7

    - name: Check changelog section exists
      if: steps.gate.outputs.release == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # This section is what the in-game changelog shows, via the plugin repo generator.
        # A release without one would ship "- <version>" and tell players nothing.
        $changelog = Get-Content "CHANGELOG.md" -Raw
        $pattern = "(?ms)^##\s+\[?" + [regex]::Escape($env:VERSION) + "\]?(?![\d.])[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
        $match = [regex]::Match($changelog, $pattern)
        if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "CHANGELOG.md has no section for $env:VERSION. Add one before releasing."
        }
        Write-Host "Changelog section for ${env:VERSION}:`n$($match.Groups[1].Value.Trim())"

  release:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest

    # The only job in this repo that may write, and it cannot run for a pull request.
    permissions:
      contents: write

    steps:
    - name: Download build output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: TeaTimeDeck

    - name: Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        # The release job does not check the repo out, so the action needs to be told
        # which commit to hang the new tag on. The tag itself is minted here, from the
        # version the build read out of the csproj.
        commit: ${{ github.sha }}
        artifacts: "TeaTimeDeck.zip,xiv.teatime.deck.streamDeckPlugin"
        tag: v${{ needs.build.outputs.version }}
        name: Tea Time Deck v${{ needs.build.outputs.version }}
        generateReleaseNotes: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          Two halves, both attached below. You need both.

          | Asset | What to do with it |
          | --- | --- |
          | `xiv.teatime.deck.streamDeckPlugin` | The Stream Deck plugin. Double-click it — the Stream Deck app installs or updates it for you. |
          | `TeaTimeDeck.zip` | The Dalamud plugin. You do not need to touch this: add the Tea Time repository in `/xlsettings` and install from `/xlplugins`. It is attached because that repository serves this file. |

    # The Tea Time plugin repo builds pluginmaster.json itself, from this repo's latest
    # release and the manifest inside its zip. It holds no credential for this repo and
    # this repo holds none for it: its schedule picks the release up within 15 minutes,
    # or run its "Publish pluginmaster" workflow by hand to publish at once.
