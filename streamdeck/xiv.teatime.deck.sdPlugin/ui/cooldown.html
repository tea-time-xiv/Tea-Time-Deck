<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Recast</title>
		<style>
			body {
				background: #2d2d2d;
				color: #d8d8d8;
				font: 9pt "Segoe UI", sans-serif;
				margin: 0;
				padding: 12px;
			}
			.row {
				align-items: center;
				display: flex;
				gap: 8px;
				margin-bottom: 8px;
			}
			label {
				color: #969696;
				flex: 0 0 84px;
				text-align: right;
			}
			select {
				background: #3d3d3d;
				border: 1px solid #4d4d4d;
				border-radius: 3px;
				color: #d8d8d8;
				flex: 1 1 auto;
				padding: 4px 6px;
			}
			.status {
				margin-left: 92px;
				min-height: 14px;
			}
			.status.error {
				color: #e46b6b;
			}
		</style>
	</head>

	<body>
		<div class="row">
			<label for="source">Action</label>
			<select id="source"></select>
		</div>

		<div class="status" id="status"></div>

		<script>
			let websocket;
			let uuid;
			let actionId;
			let settings = {};
			let sources = [];

			const sourceSelect = document.getElementById("source");
			const statusEl = document.getElementById("status");

			function setStatus(text, kind) {
				statusEl.textContent = text;
				statusEl.className = "status" + (kind ? " " + kind : "");
			}

			function save() {
				websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
			}

			function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
				uuid = inUUID;

				const parsed = JSON.parse(actionInfo);
				actionId = parsed.action;
				settings = parsed.payload.settings || {};

				websocket = new WebSocket("ws://127.0.0.1:" + port);

				websocket.onopen = function () {
					websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
					setStatus("loading…");
					websocket.send(
						JSON.stringify({
							event: "sendToPlugin",
							action: actionId,
							context: uuid,
							payload: { event: "getSources" },
						}),
					);
				};

				websocket.onmessage = function (message) {
					const data = JSON.parse(message.data);
					if (data.event !== "sendToPropertyInspector") {
						return;
					}

					if (data.payload.event === "error") {
						setStatus(data.payload.message, "error");
						return;
					}

					if (data.payload.event === "sources") {
						fill(data.payload.sources);
					}
				};
			}

			function fill(list) {
				sources = list;
				sourceSelect.innerHTML = "";

				if (list.length === 0) {
					setStatus("nothing available — is the game running?", "error");
					return;
				}

				setStatus("");

				list.forEach(function (source) {
					const option = document.createElement("option");
					option.value = String(source.id);
					option.textContent = source.name;
					sourceSelect.appendChild(option);
				});

				const known = list.some((s) => s.id === settings.id);
				if (settings.id !== undefined && known) {
					sourceSelect.value = String(settings.id);
				} else {
					choose(list[0]);
				}
			}

			function choose(source) {
				settings.id = source.id;
				settings.name = source.name;
				settings.iconId = source.iconId;
				save();
			}

			sourceSelect.addEventListener("change", function () {
				const chosen = sources.find((s) => String(s.id) === sourceSelect.value);
				if (chosen) {
					choose(chosen);
				}
			});
		</script>
	</body>
</html>
