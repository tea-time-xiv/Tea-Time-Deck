<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Vitals</title>
		<style>
			body {
				background: #2d2d2d;
				color: #d8d8d8;
				font: 9pt "Segoe UI", sans-serif;
				margin: 0;
				padding: 12px;
			}
			.row {
				align-items: center;
				display: flex;
				gap: 8px;
				margin-bottom: 8px;
			}
			label {
				color: #969696;
				flex: 0 0 84px;
				text-align: right;
			}
			select {
				background: #3d3d3d;
				border: 1px solid #4d4d4d;
				border-radius: 3px;
				color: #d8d8d8;
				flex: 1 1 auto;
				padding: 4px 6px;
			}
			.hint {
				color: #808080;
				margin-left: 92px;
			}
		</style>
	</head>

	<body>
		<div class="row">
			<label for="resource">Show</label>
			<select id="resource">
				<option value="auto">Automatic</option>
				<option value="hp">HP</option>
				<option value="mp">MP</option>
				<option value="gp">GP</option>
				<option value="cp">CP</option>
			</select>
		</div>

		<div class="hint">Automatic follows the job: GP while gathering, CP while crafting, MP otherwise.</div>

		<script>
			let websocket;
			let uuid;
			let settings = {};

			const resourceSelect = document.getElementById("resource");

			function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
				uuid = inUUID;
				settings = JSON.parse(actionInfo).payload.settings || {};
				resourceSelect.value = settings.resource || "auto";

				websocket = new WebSocket("ws://127.0.0.1:" + port);
				websocket.onopen = function () {
					websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
				};
			}

			resourceSelect.addEventListener("change", function () {
				settings.resource = resourceSelect.value;
				websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
			});
		</script>
	</body>
</html>
