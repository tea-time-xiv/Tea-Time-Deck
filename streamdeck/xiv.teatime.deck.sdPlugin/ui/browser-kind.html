<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Switch Type</title>
		<style>
			body {
				background: #2d2d2d;
				color: #d8d8d8;
				font: 9pt "Segoe UI", sans-serif;
				margin: 0;
				padding: 12px;
			}
			.hint {
				color: #969696;
				margin-bottom: 10px;
			}
			.kind {
				align-items: center;
				display: flex;
				gap: 8px;
				margin-bottom: 6px;
			}
			.kind input {
				margin: 0;
			}
			.status {
				margin-top: 10px;
				min-height: 14px;
			}
			.status.error {
				color: #e46b6b;
			}
		</style>
	</head>

	<body>
		<div class="hint">Types this key cycles through. With none ticked it cycles all of them.</div>

		<div id="kinds"></div>
		<div class="status" id="status"></div>

		<script>
			let websocket;
			let uuid;
			let actionId;
			let settings = {};

			const kindsEl = document.getElementById("kinds");
			const statusEl = document.getElementById("status");

			function setStatus(text, kind) {
				statusEl.textContent = text;
				statusEl.className = "status" + (kind ? " " + kind : "");
			}

			function save() {
				websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
			}

			function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
				uuid = inUUID;

				const parsed = JSON.parse(actionInfo);
				actionId = parsed.action;
				settings = parsed.payload.settings || {};

				websocket = new WebSocket("ws://127.0.0.1:" + port);

				websocket.onopen = function () {
					websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
					setStatus("loading…");
					websocket.send(
						JSON.stringify({
							event: "sendToPlugin",
							action: actionId,
							context: uuid,
							payload: { event: "getKinds" },
						}),
					);
				};

				websocket.onmessage = function (message) {
					const data = JSON.parse(message.data);
					if (data.event !== "sendToPropertyInspector") {
						return;
					}

					if (data.payload.event === "error") {
						setStatus(data.payload.message, "error");
						return;
					}

					if (data.payload.event === "kinds") {
						fill(data.payload.kinds);
					}
				};
			}

			function fill(list) {
				kindsEl.innerHTML = "";

				if (list.length === 0) {
					setStatus("nothing available — is the game running?", "error");
					return;
				}

				setStatus("");

				// The saved list can name a type this server no longer offers, so the ticks
				// come from the settings while the rows come from the server.
				const chosen = settings.kinds || [];

				list.forEach(function (kind) {
					const row = document.createElement("label");
					row.className = "kind";

					const box = document.createElement("input");
					box.type = "checkbox";
					box.value = kind.kind;
					box.checked = chosen.length === 0 || chosen.indexOf(kind.kind) >= 0;
					box.addEventListener("change", function () {
						choose(list);
					});

					const text = document.createElement("span");
					text.textContent = kind.displayName;

					row.appendChild(box);
					row.appendChild(text);
					kindsEl.appendChild(row);
				});
			}

			function choose(list) {
				const ticked = Array.prototype.slice
					.call(kindsEl.querySelectorAll("input:checked"))
					.map(function (box) {
						return box.value;
					});

				// Everything ticked is stored as no filter at all, so a type added by a later
				// plugin version joins the cycle instead of being silently left out of it.
				settings.kinds = ticked.length === list.length ? [] : ticked;
				save();

				setStatus(ticked.length === 0 ? "none ticked — cycling all types" : "");
			}
		</script>
	</body>
</html>
